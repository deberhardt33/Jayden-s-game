<style>
/* Layout: one big card in the middle, a shape on top, giant answer buttons below. Single bright "playroom" look by choice. */
:root {
  --sky: #5ec8f2;
  --sky2: #9be0fb;
  --card: #fffdf6;
  --ink: #23305a;
  --sun: #ffc93c;
  --good: #33c26b;
  --bad: #ff6b6b;
  --btn: #7b5cff;
  --btn-dark: #5638d6;
  --display: "Chewy", "Comic Sans MS", cursive;
  --body: "Nunito", "Trebuchet MS", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(circle at 20% 10%, var(--sky2), var(--sky) 60%);
  background-color: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  display: flex; justify-content: center; align-items: flex-start;
}
.wrap { width: 100%; max-width: 560px; display: grid; gap: 14px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 400; font-size: 2.2rem; margin: 0; color: #fff; text-shadow: 0 3px 0 var(--btn-dark); letter-spacing: 1px; }
.stars { background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 900; font-size: 1.2rem; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
.progress { height: 14px; background: rgba(255,255,255,.55); border-radius: 999px; overflow: hidden; }
.progress > div { height: 100%; width: 0; background: var(--sun); border-radius: 999px; transition: width .4s; }
.card { background: var(--card); border-radius: 28px; padding: 22px 20px 24px; box-shadow: 0 8px 0 rgba(35,48,90,.18); display: grid; gap: 16px; text-align: center; }
.qnum { font-weight: 800; font-size: .9rem; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
.question { font-family: var(--display); font-size: 2rem; margin: 0; text-wrap: balance; line-height: 1.15; }
.shape-box { display: flex; justify-content: center; }
.shape-box svg { width: 100%; max-width: 300px; height: auto; }
.answers { display: grid; gap: 12px; }
.answers.two { grid-template-columns: 1fr 1fr; }
.ans {
  font-family: var(--display); font-size: 1.7rem; letter-spacing: .5px;
  border: 0; border-radius: 18px; padding: 14px 10px; cursor: pointer;
  color: #fff; background: var(--btn); box-shadow: 0 6px 0 var(--btn-dark);
  transition: transform .1s, box-shadow .1s;
}
.ans:hover { transform: translateY(-2px); }
.ans:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--btn-dark); }
.ans:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.ans.right { background: var(--good); box-shadow: 0 6px 0 #22924f; }
.ans.wrong { background: var(--bad); box-shadow: 0 6px 0 #c94848; }
.ans:disabled { cursor: default; }
.ans:disabled:not(.right):not(.wrong) { opacity: .4; }
.big-choice { font-size: 2.2rem; padding: 22px 10px; }
.ans.times { background: #ff9f1c; box-shadow: 0 6px 0 #d07a00; }
.answers.tables { grid-template-columns: repeat(3, 1fr); }
.quiz-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mini { font-family: var(--body); font-weight: 900; font-size: .95rem; color: var(--ink); background: #eef1fb; border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer; box-shadow: 0 3px 0 rgba(35,48,90,.18); white-space: nowrap; }
.mini:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(35,48,90,.18); }
.mini:focus-visible { outline: 3px solid var(--btn); outline-offset: 2px; }
@media (max-width: 420px) { .mini { font-size: .8rem; padding: 7px 9px; } .quiz-bar .qnum { font-size: .75rem; } }
.help-btn { justify-self: center; font-family: var(--display); font-size: 1.5rem; color: var(--ink); background: #fff3c4; border: 3px dashed var(--sun); border-radius: 999px; padding: 8px 22px; cursor: pointer; }
.help-btn:focus-visible { outline: 3px solid var(--btn); outline-offset: 3px; }
.tip { background: #fff3c4; border-radius: 18px; padding: 14px 16px; font-size: 1.2rem; font-weight: 800; line-height: 1.4; }
.ans.gone { opacity: .15 !important; text-decoration: line-through; }
.tutor { background: #fff3c4; border-radius: 20px; padding: 14px 16px 16px; display: grid; gap: 10px; text-align: left; }
.tutor-head { font-family: var(--display); font-size: 1.6rem; text-align: center; }
.tsteps { margin: 0; padding-left: 1.6em; display: grid; gap: 8px; font-size: 1.2rem; font-weight: 800; line-height: 1.4; }
.tsteps li.old { opacity: .55; }
.tutor .next { font-size: 1.4rem; padding: 10px; }
svg circle.lit { fill: #ffc93c; }
.ans.pulse { animation: pulse 1s ease-in-out infinite; outline: 4px solid var(--sun); outline-offset: 3px; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.stack2 { display: inline-grid; justify-items: center; align-items: end; font-family: var(--body); font-weight: 900; font-size: 3.4rem; line-height: 1.15; font-variant-numeric: tabular-nums; padding: 18px 18px 6px; }
.stack2 .op { color: var(--bad); padding-right: 14px; }
.stack2 .line { grid-column: 1 / -1; justify-self: stretch; height: 6px; background: var(--ink); border-radius: 3px; margin-block: 4px; }
.stack2 .res { color: var(--btn); }
.stack2 .top { position: relative; }
.stack2 .top s { opacity: .45; }
.stack2 .now { position: absolute; top: -.55em; left: 50%; transform: translateX(-50%); font-size: .45em; color: var(--bad); white-space: nowrap; }
.stack2 .hl { background: #fff3c4; border-radius: 8px; }
@media (max-width: 420px) { .stack2 { font-size: 2.8rem; } }
@media (prefers-reduced-motion: reduce) { .ans.pulse { animation: none; } }
.pad { background: #fff3c4; border-radius: 20px; padding: 12px; display: grid; gap: 10px; }
#padc { width: 100%; height: 320px; border-radius: 14px; touch-action: none; cursor: crosshair;
  background-color: #fff; background-image: linear-gradient(#e6ecf7 1px, transparent 1px), linear-gradient(90deg, #e6ecf7 1px, transparent 1px);
  background-size: 28px 28px; box-shadow: inset 0 0 0 3px #ffe08a; }
.pad-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.ink { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(35,48,90,.25); cursor: pointer; }
.ink.on { box-shadow: 0 0 0 4px var(--ink); }
.mini.on { background: var(--sun); }
.hero { position: relative; background: linear-gradient(160deg, #e9e3ff, #d9f4ff); border-radius: 22px; padding: 18px 14px; overflow: hidden; }
.floaty span { position: absolute; font-size: 1.6rem; opacity: .35; animation: floaty 6s ease-in-out infinite; }
.floaty .f1 { left: 6%; top: 10%; color: #ff6b6b; }
.floaty .f2 { right: 8%; top: 8%; color: #33c26b; animation-delay: -1.5s; }
.floaty .f3 { left: 44%; bottom: 6%; color: #ff9f1c; animation-delay: -3s; }
.floaty .f4 { right: 30%; top: 40%; color: #ffc93c; animation-delay: -4s; font-size: 1.2rem; }
.floaty .f5 { left: 30%; top: 4%; color: #2ab7ca; animation-delay: -2s; font-size: 1.3rem; }
@keyframes floaty { 50% { transform: translateY(-10px) rotate(12deg); } }
.buddy-row { position: relative; display: flex; align-items: center; gap: 12px; text-align: left; }
.buddy { width: 108px; flex: none; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.wave { transform-origin: 98px 70px; animation: wave 1.2s ease-in-out infinite; }
@keyframes wave { 50% { transform: rotate(-28deg); } }
.bubble { position: relative; background: #fff; border-radius: 18px; padding: 12px 14px; font-weight: 800; font-size: 1.1rem; line-height: 1.35; box-shadow: 0 4px 0 rgba(35,48,90,.12); min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -10px; top: 50%; transform: translateY(-50%); border: 10px solid transparent; border-right-color: #fff; border-left: 0; }
.bubble-hi { font-family: var(--display); font-size: 1.6rem; font-weight: 400; margin-bottom: 2px; }
.menu-grid .big-choice { display: grid; justify-items: center; gap: 2px; }
.big-choice .mi { font-size: 2rem; line-height: 1; margin-bottom: 4px; }
.big-choice small { font-family: var(--body); font-weight: 800; font-size: .8rem; letter-spacing: 0; opacity: .92; }
.howto { margin: 0; font-weight: 800; font-size: .95rem; opacity: .7; }
@media (max-width: 420px) { .buddy { width: 84px; } .bubble { font-size: .98rem; } .bubble-hi { font-size: 1.3rem; } .big-choice small { font-size: .72rem; } }
@media (prefers-reduced-motion: reduce) { .floaty span, .buddy, .wave { animation: none; } }
.top-right { display: flex; align-items: center; gap: 8px; }
.sound { font-size: 1.3rem; background: #fff; border: 0; border-radius: 999px; width: 44px; height: 40px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
.sound:focus-visible { outline: 3px solid var(--btn); outline-offset: 2px; }
.splash { display: grid; justify-items: center; gap: 4px; padding-block: 26px 22px; }
.splash-buddy { position: relative; }
.splash-buddy .buddy { width: 150px; }
.splash-title { position: relative; font-family: var(--display); font-weight: 400; font-size: 3rem; margin: 0; color: var(--btn-dark); }
.splash-sub { position: relative; margin: 0; font-weight: 900; font-size: 1.2rem; }
.big-start { font-size: 2.2rem; padding: 18px; animation: pulse 1.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .big-start { animation: none; } }
.robot .eyes, .robot .mouth { transform-box: fill-box; transform-origin: center; }
.robot .eyes { animation: blink 4.5s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.robot.talking .mouth { animation: talk .22s ease-in-out infinite alternate; }
@keyframes talk { to { transform: scaleY(2.6); } }
.robot .bulb { animation: bulb 1.6s ease-in-out infinite; }
@keyframes bulb { 50% { fill: #ffc93c; } }
.robot .wave { transform-origin: 107px 100px; }
.intro .buddy { width: 130px; }
.caret { animation: caret 1s steps(1) infinite; color: var(--btn); }
@keyframes caret { 50% { opacity: 0; } }
.screen { position: relative; overflow: hidden; background: #1b2347; border: 6px solid #23305a; border-radius: 24px; padding: 26px 16px 22px; color: #e8f4ff; display: grid; justify-items: center; gap: 6px; box-shadow: inset 0 0 40px rgba(94,242,224,.18); }
.scan { position: absolute; inset: 0; background: repeating-linear-gradient(transparent 0 3px, rgba(255,255,255,.04) 3px 4px); pointer-events: none; }
.p1 { font-weight: 900; letter-spacing: .3em; font-size: .9rem; color: #5ef2e0; }
.pname { font-family: var(--display); font-weight: 400; font-size: clamp(3rem, 14vw, 4.6rem); margin: 0; letter-spacing: .06em; line-height: 1; }
.pname span { display: inline-block; animation: hop .6s ease-out both; }
.pname span:nth-child(6n+1) { color: #ff6b6b; } .pname span:nth-child(6n+2) { color: #ffc93c; } .pname span:nth-child(6n+3) { color: #33c26b; }
.pname span:nth-child(6n+4) { color: #5ef2e0; } .pname span:nth-child(6n+5) { color: #a08bff; } .pname span:nth-child(6n) { color: #ff9f1c; }
@keyframes hop { from { transform: translateY(-14px); } }
.ptitle { font-family: var(--display); font-size: 1.6rem; letter-spacing: .08em; color: #fff; }
.load { width: min(260px, 80%); height: 12px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 8px; }
.load > div { height: 100%; width: 100%; background: linear-gradient(90deg, #5ef2e0, #7b5cff); border-radius: 999px; animation: fill 1.4s ease-out both; }
@keyframes fill { from { width: 8%; } }
.loadtxt { font-weight: 800; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: #9fb4d8; }
@media (prefers-reduced-motion: reduce) { .robot .eyes, .robot.talking .mouth, .robot .bulb, .caret, .pname span, .load > div { animation: none; } }
.answers.menu-grid { grid-template-columns: 1fr 1fr; }
.menu-grid .big-choice { font-size: 1.6rem; line-height: 1.3; padding: 18px 6px; }
.ans.minus { background: #2ab7ca; box-shadow: 0 6px 0 #1b8a99; }
.ans.divide { background: #f15bb5; box-shadow: 0 6px 0 #c13a8c; }
.stack { font-family: var(--body); font-weight: 900; font-size: 3.4rem; line-height: 1.1; text-align: right; font-variant-numeric: tabular-nums; display: inline-grid; gap: 2px; padding: 6px 18px; }
.stack .op { margin-right: 14px; color: var(--bad); }
.stack .line { height: 6px; background: var(--ink); border-radius: 3px; margin-block: 4px; }
.stack .qm { color: var(--btn); }
@media (max-width: 420px) { .menu-grid .big-choice { font-size: 1.25rem; } .stack { font-size: 2.8rem; } }
.back { justify-self: center; font-family: var(--body); font-weight: 800; font-size: 1.1rem; background: none; border: 0; color: var(--ink); text-decoration: underline; cursor: pointer; padding: 6px 12px; }
.back:focus-visible { outline: 3px solid var(--btn); border-radius: 8px; }
.feedback { border-radius: 20px; padding: 16px; font-size: 1.25rem; font-weight: 800; line-height: 1.4; }
.feedback.good { background: #dcf7e6; }
.feedback.try { background: #fff0d6; }
.feedback.bad { background: #ffe3e3; }
.feedback .big { font-family: var(--display); font-weight: 400; font-size: 2rem; display: block; margin-bottom: 4px; }
.next { font-family: var(--display); font-size: 1.8rem; border: 0; border-radius: 18px; padding: 14px; cursor: pointer; color: var(--ink); background: var(--sun); box-shadow: 0 6px 0 #d9a21a; }
.next:focus-visible { outline: 4px solid var(--btn); outline-offset: 3px; }
.end-stars { font-size: 3rem; letter-spacing: 6px; }
.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.8); } 70% { transform: scale(1.06); } 100% { transform: scale(1); } }
.shake { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
@media (prefers-reduced-motion: reduce) { .pop, .shake { animation: none; } .progress > div { transition: none; } }
@media (max-width: 420px) { .question { font-size: 1.6rem; } .ans { font-size: 1.45rem; } h1 { font-size: 1.8rem; } }

/* Fit each question on one iPad screen */
.shape-box svg { max-height: 30vh; max-height: 30dvh; }
.stack2 { font-size: min(3.4rem, 6.5vh); }
.wrap { transition: max-width .2s; }
@media (orientation: landscape) and (min-width: 700px) {
  body { padding-block: 10px; }
  .wrap { max-width: 980px; gap: 8px; }
  h1 { font-size: 1.8rem; }
  .progress { height: 10px; }
  .card { padding: 14px 18px 16px; gap: 10px; }
  .card.quiz { grid-template-columns: 1.1fr 1fr; column-gap: 22px; align-items: center;
    grid-template-areas: "bar bar" "vis q" "vis ans" "vis help" "tip tip" "fb fb"; }
  .card.quiz > .quiz-bar { grid-area: bar; }
  .card.quiz > .question { grid-area: q; align-self: end; }
  .card.quiz > .shape-box { grid-area: vis; }
  .card.quiz > .answers { grid-area: ans; }

  .card.quiz > #tip { grid-area: tip; }
  .card.quiz > #fb { grid-area: fb; }
  .card.quiz .shape-box svg { max-width: 100% !important; max-height: 56vh; max-height: 56dvh; }
  .card.quiz .stack2 { font-size: min(4rem, 10vh); }
  .card.quiz .ans { padding: 12px 10px; }
  #padc { height: 260px; }
}
@media (orientation: portrait) and (min-width: 700px) {
  .wrap { max-width: 640px; }
}

/* ---------- multiplayer ---------- */
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: #fff; font-weight: 800; padding: 12px 18px; border-radius: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.2); max-width: min(92vw, 520px); text-align: center; }
.pause { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--sun); color: var(--ink); font-weight: 900; text-align: center; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.who { font-size: .95rem; }
.pname.guest { font-size: clamp(2.2rem, 10vw, 3.6rem); }
.mode-grid, .count-grid { grid-template-columns: 1fr 1fr; }
.who-grid .big-choice { display: grid; justify-items: center; gap: 2px; font-size: 1.6rem; line-height: 1.25; padding: 18px 8px; }

.mode-grid .big-choice { display: grid; justify-items: center; gap: 2px; font-size: 1.7rem; line-height: 1.25; padding: 18px 8px; }

.level-btn { display: grid; gap: 2px; justify-items: center; }

.lv-easy { background: #33c26b; box-shadow: 0 6px 0 #22924f; }
.lv-hard { background: #ff6b6b; box-shadow: 0 6px 0 #c94848; }
.loading { display: grid; justify-items: center; gap: 12px; padding: 30px 0; font-weight: 900; font-size: 1.2rem; }
.spinner { width: 46px; height: 46px; border-radius: 50%; border: 6px solid #e2dcff; border-top-color: var(--btn); animation: spin .8s linear infinite; }

.join { display: grid; gap: 8px; text-align: left; }

.join-note { margin: 0; font-weight: 800; opacity: .7; font-size: .95rem; }
.lobby-head { display: flex; align-items: center; gap: 10px; text-align: left; }

.tag.lv-hard { background: #ff6b6b; }
.rules { display: grid; gap: 8px; }
.rule-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; font-weight: 900; }
.rule-row > span { min-width: 90px; text-align: right; margin-right: 4px; }
.rchip { font: 900 1rem var(--body); color: var(--ink); background: #eef1fb; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; box-shadow: 0 3px 0 rgba(35,48,90,.18); }
.rchip.on { background: var(--btn); color: #fff; }
.rchip:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.sub { margin: 4px 0 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; }
.plist { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 48px; }

<body>

<div id="toast" class="toast" role="status" hidden></div>
<div id="pause" class="pause" role="status" hidden>⏸ Jayden stepped away. The game will keep going when he comes back.</div>
<div class="wrap">
  <header>
    <h1>Jayden's Quiz Quest</h1>
    <div class="top-right"><button class="sound" id="sound" aria-label="Sound on or off">🔊</button><div class="stars">⭐ <span id="score">0</span></div></div>
  </header>
  <div class="progress"><div id="bar"></div></div>
  <main class="card" id="card"></main>
</div>

<script>
const ROUND = 10;
const COLORS = ["#ff6b6b", "#7b5cff", "#33c26b", "#ff9f1c", "#2ab7ca", "#f15bb5"];

// regular shape points around the center of a 220 x 150 box
function regular(n, r, startDeg) {
  const p = [];
  for (let k = 0; k < n; k++) {
    const a = (startDeg + k * 360 / n) * Math.PI / 180;
    p.push((110 + r * Math.cos(a)).toFixed(1) + "," + (75 + r * Math.sin(a)).toFixed(1));
  }
  return p.join(" ");
}

const SHAPES = {
  circle:        { name: "Circle",        quad: false, sides: 0, round: "circle",
                   why: "A circle is perfectly round, like a pizza. It has no straight sides and no corners." },
  oval:          { name: "Oval",          quad: false, sides: 0, round: "oval",
                   why: "An oval is round but stretched out, like an egg. It has no straight sides and no corners." },
  triangle:      { name: "Triangle",      quad: false, sides: 3, pts: "110,10 200,135 20,135",
                   why: "A triangle has 3 sides and 3 corners. \"Tri\" means 3, like a tricycle has 3 wheels!" },
  square:        { name: "Square",        quad: true,  sides: 4, pts: "60,15 160,15 160,115 60,115",
                   why: "A square has 4 sides that are all the same length, and 4 square corners." },
  rectangle:     { name: "Rectangle",     quad: true,  sides: 4, pts: "20,30 200,30 200,115 20,115",
                   why: "A rectangle has 4 square corners, with 2 long sides and 2 short sides, like a door." },
  rhombus:       { name: "Rhombus",       quad: true,  sides: 4, pts: "110,8 180,75 110,142 40,75",
                   why: "A rhombus has 4 sides that are all the same length, but it is tilted like a diamond. No square corners!" },
  trapezoid:     { name: "Trapezoid",     quad: true,  sides: 4, pts: "70,25 150,25 205,120 15,120",
                   why: "A trapezoid has 4 sides, but only 1 pair goes the same way. The top is short and the bottom is long." },
  parallelogram: { name: "Parallelogram", quad: true,  sides: 4, pts: "60,25 205,25 160,120 15,120",
                   why: "A parallelogram looks like a rectangle that got pushed over. Its opposite sides go the same way." },
  pentagon:      { name: "Pentagon",      quad: false, sides: 5, pts: regular(5, 68, -90),
                   why: "A pentagon has 5 sides and 5 corners. It looks like the shape of a house!" },
  hexagon:       { name: "Hexagon",       quad: false, sides: 6, pts: regular(6, 68, 0),
                   why: "A hexagon has 6 sides and 6 corners, just like the cells in a honeycomb." },
  octagon:       { name: "Octagon",       quad: false, sides: 8, pts: regular(8, 68, 22.5),
                   why: "An octagon has 8 sides and 8 corners, like a STOP sign. \"Oct\" means 8, like an octopus has 8 arms!" },
};
const ALL = Object.keys(SHAPES);
const QUADS = ALL.filter(k => SHAPES[k].quad);
const POLYS = ALL.filter(k => SHAPES[k].sides > 0);

const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function shapeSVG(key) {
  const c = pick(COLORS), s = SHAPES[key];
  const style = `fill="${c}" stroke="#23305a" stroke-width="5" stroke-linejoin="round"`;
  const body = s.round === "circle" ? `<circle cx="110" cy="75" r="65" ${style}/>`
             : s.round === "oval"   ? `<ellipse cx="110" cy="75" rx="95" ry="55" ${style}/>`
             : `<polygon points="${s.pts}" ${style}/>`;
  return `<svg viewBox="0 0 220 150" role="img" aria-label="a shape">${body}</svg>`;
}

const SHAPE_HINT = {
  circle: "Look closely. Does it have any straight sides or corners? Is it perfectly round like a pizza?",
  oval: "Is it round like a ball, or stretched out like an egg?",
  triangle: "Count the sides. Remember: tri means 3, like a tricycle!",
  square: "Count the sides. Are they all the same length? Are the corners square like a box?",
  rectangle: "Are the corners square? Are all the sides the same, or are 2 long and 2 short?",
  rhombus: "The sides look the same length, but are the corners square or slanted like a diamond?",
  trapezoid: "Look at the top and the bottom. Are they the same length?",
  parallelogram: "Does it look like a rectangle that got pushed over?",
  pentagon: "Count the sides with your finger. It looks a little like a house!",
  hexagon: "Count the sides with your finger. Think of a honeycomb!",
  octagon: "Count the sides with your finger. Think of a STOP sign!",
};

const article = n => /^[AEIOU]/.test(n) ? "an " + n.toLowerCase() : "a " + n.toLowerCase();

// Simple kinds of questions
function makeName() {
  const key = pick(ALL);
  const wrongs = shuffle(ALL.filter(k => k !== key)).slice(0, 2);
  return { shape: key, text: "What shape is this?",
           options: shuffle([key, ...wrongs].map(k => SHAPES[k].name)),
           answer: SHAPES[key].name, why: SHAPES[key].why, kind: "name", key };
}
function makeIsQuad() {
  const key = Math.random() < 0.5 ? pick(QUADS) : pick(ALL.filter(k => !SHAPES[k].quad));
  const s = SHAPES[key];
  const why = s.quad
    ? `Count the sides: 1, 2, 3, 4! It has 4 sides, so it IS a quadrilateral. "Quad" means 4.`
    : s.sides === 0
      ? `This is ${article(s.name)}. It has no straight sides at all! A quadrilateral must have exactly 4 straight sides.`
      : `Count the sides: it has ${s.sides} sides. A quadrilateral must have exactly 4 sides, so this is NOT one. It is ${article(s.name)}.`;
  return { shape: key, text: "Is this a quadrilateral?", options: ["Yes", "No"],
           answer: s.quad ? "Yes" : "No", why, two: true, kind: "quad", key,
           hint: "Quad means 4. Count the straight sides with your finger. Does it have exactly 4?" };
}
function makeSides() {
  const key = pick(POLYS), n = SHAPES[key].sides;
  const pool = shuffle([3, 4, 5, 6, 8].filter(x => x !== n)).slice(0, 2);
  const count = Array.from({ length: n }, (_, k) => k + 1).join(", ");
  return { shape: key, text: "How many sides does this shape have?",
           options: shuffle([n, ...pool].map(String)), answer: String(n),
           kind: "sides", key,
           why: `Count them: ${count}! ${article(SHAPES[key].name).replace(/^./, c => c.toUpperCase())} has ${n} sides.` };
}

// Multiplication: a groups of b, shown as rows of dots
function dotsSVG(a, b) {
  const c = pick(COLORS), s = 26;
  let dots = "";
  for (let r = 0; r < a; r++) for (let k = 0; k < b; k++)
    dots += `<circle data-r="${r}" data-k="${k}" cx="${k * s + s / 2}" cy="${r * s + s / 2}" r="9.5" fill="${c}" stroke="#23305a" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${b * s} ${a * s}" style="max-width:${Math.min(300, b * 34)}px;overflow:visible" role="img" aria-label="${a} rows of ${b} dots">${dots}</svg>`;
}
function makeTimes(table, lo = 1, hi = 10) {
  const a = table || 2 + Math.floor(Math.random() * 9);
  const b = lo + Math.floor(Math.random() * (hi - lo + 1));
  const p = a * b;
  const wrong = shuffle([...new Set([p + a, p - a, p + b, p - b, p + 1, p - 1, p + 10])]
    .filter(x => x > 0 && x !== p)).slice(0, 2);
  const groups = a === 1 ? "1 group" : `${a} groups`;
  const add = a <= 10 ? Array(a).fill(b).join(" + ") + " = " + p : "";
  return { shape: a + "x" + b, text: `What is ${a} × ${b}?`,
           visual: dotsSVG(a, b), kind: "times", a, b,
           options: shuffle([p, ...wrong].map(String)), answer: String(p),
           hint: a > 2
             ? `${a} × ${b} means ${a} rows of ${b}. Count the dots, or skip count by ${b}: ${b}, ${2 * b}, ... keep going until you count ${a} rows!`
             : `${a} × ${b} means ${a} rows of ${b}. Count all the dots!`,
           why: `${a} × ${b} means ${groups} of ${b}. Look at the dots: ${a} rows with ${b} in each row. ${add}` };
}

// Subtraction within 1000 (3rd grade), shown stacked like on paper
const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
function makeMinus(a, b) {
  if (a === undefined) {
    if (Math.random() < 0.5) { a = rnd(20, 99); b = rnd(10, a - 5); }
    else { a = rnd(120, 999); b = rnd(20, a - 10); }
  }
  const d = a - b;
  const wrong = shuffle([...new Set([d + 1, d - 1, d + 10, d - 10, d + 100, a + b])]
    .filter(x => x > 0 && x !== d)).slice(0, 2);
  return { shape: "m" + a + "-" + b, text: `What is ${a} − ${b}?`,
           visual: stackHTML(a, b), kind: "minus", a, b,
           options: shuffle([d, ...wrong].map(String)), answer: String(d),
           hint: `Start with the ones place on the right. If the top number is smaller, borrow 10 from the next place. Or count up from ${b} to ${a}!`,
           why: `${a} − ${b} = ${d}. Check it by adding back: ${b} + ${d} = ${a}. Adding back is a great way to check subtraction!` };
}

// Division: share into equal groups (facts up to 100)
function makeDivide(div, lo = 1, hi = 10) {
  const d = div || rnd(2, 10), q = rnd(lo, hi), p = d * q;
  const wrong = shuffle([...new Set([q + 1, q - 1, q + 2, d, p - d])]
    .filter(x => x > 0 && x !== q)).slice(0, 2);
  return { shape: "d" + p + "/" + d, text: `What is ${p} ÷ ${d}?`,
           visual: dotsSVG(d, q), kind: "divide", d, q,
           options: shuffle([q, ...wrong].map(String)), answer: String(q),
           hint: `Count the dots in just ONE row. Or think: ${d} × what = ${p}?`,
           why: `${p} ÷ ${d} means share ${p} into ${d} equal groups. Each row of dots is a group, and each group gets ${q}. Check: ${d} × ${q} = ${p}.` };
}

function buildRound(mode, table) {
  const makers = mode === "times" ? [() => makeTimes(table)]
               : mode === "minus" ? [makeMinus]
               : mode === "divide" ? [() => makeDivide(table)]
               : [makeName, makeName, makeName, makeSides, makeSides, makeIsQuad];
  const qs = []; let last = "";
  while (qs.length < ROUND) {
    const q = pick(makers)();
    if (q.shape + q.text === last) continue; // no two in a row the same
    if (!q.visual) q.visual = shapeSVG(q.shape);
    last = q.shape + q.text; qs.push(q);
  }
  return qs;
}

const card = document.getElementById("card");
let qs, i, score, mode, table;

const BUDDY = `<svg class="buddy robot" viewBox="0 0 140 160" aria-label="Foxy Fox, your computer sidekick">
  <path d="M98 146 Q142 140 132 96 Q122 122 94 126 Z" fill="#ff8a3d" stroke="#23305a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M120 128 Q134 124 132 104 Q127 116 114 120 Z" fill="#fff"/>
  <polygon points="26,52 34,6 64,36" fill="#ff8a3d" stroke="#23305a" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="114,52 106,6 76,36" fill="#ff8a3d" stroke="#23305a" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="34,40 37,18 52,34" fill="#23305a" opacity=".85"/>
  <polygon points="106,40 103,18 88,34" fill="#23305a" opacity=".85"/>
  <ellipse cx="70" cy="64" rx="48" ry="40" fill="#ff8a3d" stroke="#23305a" stroke-width="5"/>
  <path d="M24 70 Q70 124 116 70 Q94 86 70 82 Q46 86 24 70 Z" fill="#fff"/>
  <g class="eyes"><ellipse cx="52" cy="60" rx="5.5" ry="7.5" fill="#23305a"/><ellipse cx="88" cy="60" rx="5.5" ry="7.5" fill="#23305a"/></g>
  <circle cx="54" cy="57" r="2" fill="#fff"/><circle cx="90" cy="57" r="2" fill="#fff"/>
  <ellipse cx="70" cy="80" rx="7" ry="5" fill="#23305a"/>
  <rect class="mouth" x="63" y="89" width="14" height="4" rx="2" fill="#23305a"/>
  <path d="M22 62 Q22 14 70 14 Q118 14 118 62" fill="none" stroke="#23305a" stroke-width="6" stroke-linecap="round"/>
  <rect x="12" y="52" width="16" height="24" rx="7" fill="#5ef2e0" stroke="#23305a" stroke-width="4"/>
  <rect x="112" y="52" width="16" height="24" rx="7" fill="#5ef2e0" stroke="#23305a" stroke-width="4"/>
  <path d="M20 74 Q24 96 48 96" fill="none" stroke="#23305a" stroke-width="4" stroke-linecap="round"/>
  <circle class="bulb" cx="50" cy="96" r="4.5" fill="#ff6b6b" stroke="#23305a" stroke-width="2.5"/>
  <g class="arm-l"><rect x="26" y="112" width="14" height="30" rx="7" fill="#ff8a3d" stroke="#23305a" stroke-width="4"/></g>
  <g class="wave"><rect x="100" y="96" width="14" height="30" rx="7" fill="#ff8a3d" stroke="#23305a" stroke-width="4"/></g>
  <ellipse cx="70" cy="132" rx="32" ry="26" fill="#ff8a3d" stroke="#23305a" stroke-width="5"/>
  <ellipse cx="70" cy="136" rx="17" ry="18" fill="#fff"/>
</svg>`;

let welcomed = false;
function menu(first) {
  card.classList.remove("quiz", "mp");
  if (welcomed && !first) chime();
  document.getElementById("bar").style.width = "0%";
  const h = new Date().getHours();

      </div>
      <div class="buddy-row">
        ${BUDDY}

        </div>
      </div>

    <h2 class="question">Choose your mission</h2>
    <div class="answers menu-grid">
      <button class="ans big-choice" id="pick-shapes"><span class="mi">🔷</span>Shapes<small>Name shapes and count sides</small></button>
      <button class="ans big-choice minus" id="pick-minus"><span class="mi">➖</span>Subtraction<small>Take away numbers</small></button>
      <button class="ans big-choice times" id="pick-times"><span class="mi">✖️</span>Multiplication<small>Count groups of dots</small></button>
      <button class="ans big-choice divide" id="pick-divide"><span class="mi">➗</span>Division<small>Share into equal groups</small></button>
    </div>
    <p class="howto">🎯 Play solo &nbsp;·&nbsp; 👥 Race friends in multiplayer &nbsp;·&nbsp; 💡 Draw to help</p>`;
  if (welcomed) talk(first ? "Awesome! Pick a mission." : `Welcome back${isAdmin() ? ", Jayden" : ""}! Pick a mission.`, card.querySelector(".robot"));
  ["shapes", "minus", "times", "divide"].forEach(m => document.getElementById("pick-" + m).onclick = () => modeMenu(m));
}

function splash() {

// Foxy Fox introduces himself, one line at a time
function intro() {
  card.classList.remove("quiz", "mp");
  const lines = isAdmin() ? [
    "Hey Jayden! I'm Foxy Fox, your computer sidekick.",
    "I loaded 4 missions for you: Shapes, Subtraction, Multiplication, and Division.",
    "Every right answer earns you a star. If a problem is tricky, you get a second try, and you can use the drawing pad to work it out.",
    "Want to race your friends? Pick Multiplayer to open your room. You're the host, so you pick the rules!",
    "Ready to play, Jayden?",
  ] : [
    "Hey there! I'm Foxy Fox, the computer sidekick here at Quiz Quest.",
    "There are 4 missions: Shapes, Subtraction, Multiplication, and Division.",
    "Play by yourself, or pick Multiplayer to join Jayden's room and race everyone.",
    "Ready to play?",
  ];
  let k = 0;
  card.innerHTML = `
    <div class="hero intro">
      <div class="buddy-row">
        ${BUDDY}
        <div class="bubble"><div class="bubble-hi">FOXY FOX</div><span id="say"></span><span class="caret">▍</span></div>
      </div>
    </div>
    <button class="next" id="inext">Next ➜</button>
    <button class="back" id="skip">Skip intro</button>`;
  const robot = card.querySelector(".robot"), out = document.getElementById("say"), nb = document.getElementById("inext");
  let typer;
  const sayLine = () => {
    const t = lines[k];
    clearInterval(typer); out.textContent = "";
    robot.classList.add("talking");
    let n = 0;
    typer = setInterval(() => { out.textContent = t.slice(0, ++n); if (n >= t.length) clearInterval(typer); }, 28);
    talk(t, robot);
    const last = k === lines.length - 1;
    nb.textContent = last ? "Let's go! 🎮" : "Next ➜";
  };
  const done = () => { clearInterval(typer); welcomed = true; menu(true); };
  nb.onclick = () => { k++; k < lines.length ? sayLine() : done(); };
  document.getElementById("skip").onclick = done;
  setTimeout(sayLine, 500);
}

// speak and move Foxy's mouth until he finishes
function talk(text, robot) {
  const stop = () => robot && robot.classList.remove("talking");
  if (robot) robot.classList.add("talking");
  if (!soundOn || !window.speechSynthesis) { setTimeout(stop, text.length * 45); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1; u.pitch = 1.1; u.lang = "en-US";
    u.onend = stop; u.onerror = stop;
    speechSynthesis.speak(u);
    setTimeout(stop, text.length * 90);
  } catch (e) { stop(); }
}

function tableMenu(m) {
  card.classList.remove("quiz", "mp");
  const nums = [2, 3, 4, 5, 6, 7, 8, 9, 10];
  const isTimes = m === "times";
  card.innerHTML = `
    ${navBar("Pick a number")}
    <h2 class="question pop">${isTimes ? "Which times table?" : "Divide by which number?"}</h2>
    <div class="answers tables">
      ${nums.map(n => `<button class="ans" data-t="${n}">${isTimes ? n + "s" : "÷ " + n}</button>`).join("")}
    </div>
    <button class="ans ${isTimes ? "times" : "divide"}" id="mix">🎲 Mix them all!</button>
    ${helpBlock()}`;
  wireHelp(isTimes
    ? "Pick the times table you are learning in class, like the 2s or the 5s. Want a challenge? Tap Mix them all!"
    : "Pick the number you want to divide by. If you know your 2s times table, try ÷ 2! Want a challenge? Tap Mix them all!");
  card.querySelectorAll("[data-t]").forEach(b => b.onclick = () => start(m, +b.dataset.t));
  document.getElementById("mix").onclick = () => start(m, 0);
  wireNav(menu, () => tableMenu(m));
}

// ---------- Help me walkthrough ----------
const NS = "http://www.w3.org/2000/svg";
const cap = w => w[0].toUpperCase() + w.slice(1);
function stackHTML(a, b) {
  const n = String(a).length, A = String(a).padStart(n, " "), B = String(b).padStart(n, " ");
  const col = i => n - 1 - i;
  return `<div class="stack2" style="grid-template-columns:auto repeat(${n},0.72em)">`
    + `<span></span>` + [...A].map((c, i) => `<span class="top" data-c="${col(i)}">${c.trim()}</span>`).join("")
    + `<span class="op">−</span>` + [...B].map((c, i) => `<span data-c="${col(i)}">${c.trim()}</span>`).join("")
    + `<span class="line"></span>`
    + `<span></span>` + Array.from({ length: n }, (_, i) => `<span class="res" data-c="${col(i)}">?</span>`).join("")
    + `</div>`;
}
function polyPts(key) { return SHAPES[key].pts.split(" ").map(p => p.split(",").map(Number)); }
function markSide(box, key, idx) {
  const svg = box.querySelector("svg"); svg.style.overflow = "visible";
  const P = polyPts(key), A = P[idx], B = P[(idx + 1) % P.length];
  const ln = document.createElementNS(NS, "line");
  [["x1", A[0]], ["y1", A[1]], ["x2", B[0]], ["y2", B[1]], ["stroke", "#ffc93c"], ["stroke-width", 10], ["stroke-linecap", "round"]]
    .forEach(([k, v]) => ln.setAttribute(k, v));
  svg.appendChild(ln);
  const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
  const g = document.createElementNS(NS, "g");
  g.innerHTML = `<circle cx="${mx}" cy="${my}" r="13" fill="#fff" stroke="#23305a" stroke-width="3"/>
    <text x="${mx}" y="${my + 6}" text-anchor="middle" font-size="17" font-weight="900" fill="#23305a" font-family="Nunito, sans-serif">${idx + 1}</text>`;
  svg.appendChild(g);
}
function litRows(box, upto) { box.querySelectorAll("circle[data-r]").forEach(c => c.classList.toggle("lit", +c.dataset.r < upto)); }
function numberRow(box, row) {
  const svg = box.querySelector("svg");
  box.querySelectorAll(`circle[data-r="${row}"]`).forEach((c, k) => {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", c.getAttribute("cx")); t.setAttribute("y", +c.getAttribute("cy") + 4.5);
    t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", "12"); t.setAttribute("font-weight", "900");
    t.setAttribute("fill", "#23305a"); t.textContent = k + 1; svg.appendChild(t);
  });
}

const QUAD_CLUES = {
  square: ["Look at the corners. They are all square corners, like the corner of a book.", "Now look at the sides. All 4 sides are the same length!"],
  rectangle: ["Look at the corners. They are all square corners, like a door.", "Now look at the sides. 2 sides are long and 2 sides are short."],
  rhombus: ["Look at the sides. All 4 sides are the same length.", "But the corners are slanted, not square. It looks like a diamond!"],
  trapezoid: ["Look at the top and the bottom. The top is short and the bottom is long.", "Only the top and bottom go the same way. That's the trapezoid clue!"],
  parallelogram: ["Look at the corners. They are slanted, not square.", "It looks like a rectangle that got pushed over, and the opposite sides go the same way."],
};
const OTHER_CLUES = {
  triangle: "3 sides! Tri means 3, like a tricycle.",
  pentagon: "5 sides! A shape with 5 sides is a pentagon. Penta means 5.",
  hexagon: "6 sides! A shape with 6 sides is a hexagon, like a honeycomb.",
  octagon: "8 sides! Oct means 8, like an octopus has 8 arms.",
};

function buildSteps(q) {
  const tap = `Tap <b>${q.answer}</b> up above!`;
  const S = (say, act) => ({ say, act });
  if (q.kind === "times") {
    const { a, b } = q, st = [S(`${a} × ${b} means <b>${a} rows</b> with <b>${b} dots</b> in each row. Let's count one row at a time!`)];
    for (let r = 1; r <= a; r++)
      st.push(S(r === 1 ? `Row 1: ${b}` : `Row ${r}: ${b * (r - 1)} + ${b} = <b>${b * r}</b>`, box => litRows(box, r)));
    st.push(S(`${a} rows of ${b} makes <b>${a * b}</b>! ${tap}`));
    return st;
  }
  if (q.kind === "divide") {
    const { d, q: k } = q, p = d * k;
    return [
      S(`${p} ÷ ${d} means share ${p} dots into <b>${d} equal groups</b>. Each row is one group.`),
      S(`Let's count the dots in just the first group.`, box => { litRows(box, 1); numberRow(box, 0); }),
      S(`The first group has <b>${k}</b> dots. Every group gets the same amount!`),
      S(`Check it: ${d} groups × ${k} = ${p}. ✓`, box => litRows(box, d)),
      S(`So ${p} ÷ ${d} = <b>${k}</b>! ${tap}`),
    ];
  }
  if (q.kind === "minus") {
    const { a, b } = q, n = String(a).length;
    const da = [...String(a)].reverse().map(Number), db = [...String(b)].reverse().map(Number);
    const cur = da.slice(), place = ["ones", "tens", "hundreds"];
    const st = [S(`Let's subtract one place at a time, starting on the <b>right</b> with the ones.`)];
    for (let c = 0; c < n; c++) {
      let top = cur[c]; const bot = db[c];
      const changes = [];
      let say = `<b>${cap(place[c])}:</b> `;
      if (bot === undefined) {
        say += top === 0 ? `There is 0 left here, so we don't need to write anything.` : `Nothing to take away from ${top}, so it stays <b>${top}</b>.`;
      } else if (top < bot) {
        const j = c + 1;
        if (cur[j] === 0) {
          cur[j + 1] -= 1; cur[j] = 9; changes.push([j + 1, cur[j + 1]], [j, cur[j]]);
          say += `${top} is smaller than ${bot}. The ${place[j]} has 0, so we borrow from the ${place[j + 1]}. The 0 becomes 9.`;
        } else {
          cur[j] -= 1; changes.push([j, cur[j]]);
          say += `${top} is smaller than ${bot}, so we borrow 1 from the ${place[j]}. It goes from ${cur[j] + 1} to ${cur[j]}.`;
        }
        top += 10; cur[c] = top; changes.push([c, top]);
        say += ` Now we have ${top}. ${top} − ${bot} = <b>${top - bot}</b>.`;
      } else {
        say += `${top} − ${bot} = <b>${top - bot}</b>.`;
      }
      const res = top - (bot || 0), shown = (c === n - 1 && res === 0 && n > 1) ? "" : res;
      const snap = changes.slice();
      st.push(S(say, box => {
        box.querySelectorAll("[data-c]").forEach(e => e.classList.toggle("hl", +e.dataset.c === c));
        snap.forEach(([j, v]) => { const e = box.querySelector(`.top[data-c="${j}"]`); e.innerHTML = `<s>${da[j]}</s><b class="now">${v}</b>`; });
        box.querySelector(`.res[data-c="${c}"]`).textContent = shown;
      }));
    }
    st.push(S(`Check it by adding back: ${b} + ${a - b} = ${a}. ✓ So the answer is <b>${a - b}</b>! ${tap}`,
      box => box.querySelectorAll("[data-c]").forEach(e => e.classList.remove("hl"))));
    return st;
  }
  // shapes
  const s = SHAPES[q.key], n = s.sides;
  const countSteps = () => Array.from({ length: n }, (_, k) =>
    S(k === 0 ? "That's side 1." : `Side ${k + 1}!`, box => markSide(box, q.key, k)));
  if (q.kind === "sides")
    return [S("Let's count the sides together. Watch for the yellow numbers!"), ...countSteps(), S(`We counted <b>${n}</b> sides! ${tap}`)];
  if (q.kind === "quad") {
    if (!n) return [S("Trace around the edge with your finger. Do you feel any straight sides?"),
                    S("It's curvy all the way around! It has <b>0</b> straight sides and no corners."),
                    S(`A quadrilateral needs exactly 4 straight sides. So the answer is <b>No</b>! ${tap}`)];
    return [S("Quad means 4. Let's count the sides!"), ...countSteps(),
      S(`It has ${n} sides. ${n === 4 ? "That's exactly 4, so it IS a quadrilateral" : "That's not 4, so it is NOT a quadrilateral"}! ${tap}`)];
  }
  // name
  if (!n) return [S("Look at the edge. No straight sides and no corners, so it's a round shape."),
    S(q.key === "circle" ? "Is it perfectly round like a pizza, or stretched out like an egg? It's perfectly round!" : "Is it perfectly round like a pizza, or stretched out like an egg? It's stretched out like an egg!"),
    S(`So it's ${article(s.name)}! ${tap}`)];
  const st = [S("Let's count the sides first!", box => { for (let k = 0; k < n; k++) markSide(box, q.key, k); }),
              S(`It has <b>${n}</b> sides.`)];
  if (s.quad) { st.push(S("4 sides means it's a quadrilateral! Now let's find out which kind.")); QUAD_CLUES[q.key].forEach(t => st.push(S(t))); }
  else st.push(S(OTHER_CLUES[q.key]));
  st.push(S(`So it's ${article(s.name)}! ${tap}`));
  return st;
}

// Scratch pad: a blank page to draw on while solving
function wirePad() {
  const btn = document.getElementById("help");
  btn.onclick = () => {
    btn.hidden = true;
    const inks = ["#23305a", "#ff6b6b", "#33c26b", "#7b5cff"];
    document.getElementById("tip").innerHTML = `<div class="pad pop">
        <div class="tutor-head">✏️ Draw to help you think!</div>
        <canvas id="padc" aria-label="drawing space"></canvas>
        <div class="pad-tools">
          ${inks.map((c, k) => `<button class="ink${k ? "" : " on"}" data-ink="${c}" style="background:${c}" aria-label="pen color"></button>`).join("")}
          <button class="mini" id="eraser">🧽 Eraser</button>
          <button class="mini" id="clear">🗑️ Clear</button>
          <button class="mini" id="closepad">✖ Close</button>
        </div></div>`;
    const cv = document.getElementById("padc"), ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
    ctx.scale(dpr, dpr); ctx.lineCap = "round"; ctx.lineJoin = "round";
    let ink = inks[0], erase = false, drawing = false, last = null;
    const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.onpointerdown = e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); dot(last); };
    cv.onpointermove = e => { if (!drawing) return; const p = pos(e); line(last, p); last = p; };
    cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
    function style() {
      ctx.globalCompositeOperation = erase ? "destination-out" : "source-over";
      ctx.strokeStyle = ctx.fillStyle = ink; ctx.lineWidth = erase ? 26 : 5;
    }
    function dot(p) { style(); ctx.beginPath(); ctx.arc(p[0], p[1], ctx.lineWidth / 2, 0, 7); ctx.fill(); }
    function line(a, b) { style(); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
    const tools = document.querySelectorAll(".ink, #eraser");
    document.querySelectorAll(".ink").forEach(b => b.onclick = () => {
      tools.forEach(t => t.classList.remove("on")); b.classList.add("on"); ink = b.dataset.ink; erase = false; });
    document.getElementById("eraser").onclick = e => {
      tools.forEach(t => t.classList.remove("on")); e.currentTarget.classList.add("on"); erase = true; };
    document.getElementById("clear").onclick = () => ctx.clearRect(0, 0, cv.width, cv.height);
    document.getElementById("closepad").onclick = () => { document.getElementById("tip").innerHTML = ""; btn.hidden = false; };
  };
}

function wireTutor(q) {
  const btn = document.getElementById("help");
  btn.onclick = () => {
    btn.hidden = true;
    const steps = buildSteps(q), box = card.querySelector(".shape-box");
    document.getElementById("tip").innerHTML = `<div class="tutor pop">
        <div class="tutor-head">💡 Let's do it together!</div>
        <ol class="tsteps" id="tsteps"></ol>
        <button class="next" id="tnext">Next step ➜</button></div>`;
    let k = 0;
    const next = () => {
      const st = steps[k];
      if (st.act) st.act(box);
      document.querySelectorAll("#tsteps li").forEach(x => x.classList.add("old"));
      const li = document.createElement("li"); li.className = "pop"; li.innerHTML = st.say;
      document.getElementById("tsteps").appendChild(li);
      k++;
      const nb = document.getElementById("tnext");
      if (k >= steps.length) {
        nb.hidden = true;
        const ab = [...card.querySelectorAll(".ans")].find(b => b.dataset.a === q.answer);
        if (ab && !ab.disabled) ab.classList.add("pulse");
      } else nb.textContent = `Next step ➜  (${k + 1} of ${steps.length})`;
    };
    document.getElementById("tnext").onclick = next;
    next();
  };
}

// Help me button: shows a tip, and on a question also takes away one wrong answer
function helpBlock() {
  return `<button class="help-btn" id="help">💡 Help me</button><div id="tip"></div>`;
}
function wireHelp(text, onUse) {
  const b = document.getElementById("help");
  b.onclick = () => {
    document.getElementById("tip").innerHTML = `<div class="tip pop">💡 ${text}</div>`;
    b.hidden = true;
    if (onUse) onUse();
  };
}

function start(m, t) {
  if (m) { mode = m; table = t; }
  qs = buildRound(mode, table); i = 0; score = 0;
  document.getElementById("score").textContent = 0;
  show();
}

function show() {
  card.classList.add("quiz");
  document.getElementById("bar").style.width = (i / ROUND * 100) + "%";
  const q = qs[i];
  card.innerHTML = `
    ${navBar(`Question ${i + 1} of ${ROUND}`)}
    <h2 class="question">${q.text}</h2>
    <div class="shape-box pop">${q.visual}</div>
    <div class="answers ${q.two ? "two" : ""}">
      ${q.options.map(o => `<button class="ans" data-a="${o}">${o}</button>`).join("")}
    </div>
    ${helpBlock()}
    <div id="fb"></div>`;
  card.querySelectorAll(".ans").forEach(b => b.onclick = () => answer(b));
  wirePad();
  wireNav(menu, () => start());
}

const CHEERS = ["Awesome!", "You got it!", "Super smart!", "Way to go!", "Nailed it!", "Shape master!"];

function answer(btn) {
  const q = qs[i];
  const ok = btn.dataset.a === q.answer;
  // First wrong try: second chance, no answer shown yet
  if (!ok && !q.tried) {
    q.tried = true;
    btn.classList.add("wrong"); btn.disabled = true;
    document.getElementById("fb").innerHTML = `<div class="feedback try pop"><span class="big">Not quite! Try again 💪</span>You get one more chance. Tap 💡 Help me if you want me to walk you through it.</div>`;
    card.classList.add("shake"); setTimeout(() => card.classList.remove("shake"), 400);
    beep(false); speak("Not quite. Try again!");
    return;
  }
  card.querySelectorAll(".ans").forEach(b => {
    b.disabled = true;
    if (b.dataset.a === q.answer) b.classList.add("right");
  });
  const tn = document.getElementById("tnext"); if (tn) tn.hidden = true;
  card.querySelectorAll(".pulse").forEach(b => b.classList.remove("pulse"));
  const fb = document.getElementById("fb");
  if (ok) {
    score++; document.getElementById("score").textContent = score;
    const cheer = q.tried ? "You got it on the second try! 🎉" : "🎉 " + pick(CHEERS);
    fb.innerHTML = `<div class="feedback good pop"><span class="big">${cheer}</span>${q.why}</div>`;
    beep(true); confetti(40); speak(cheer.replace(/🎉/g, ""));
  } else {
    btn.classList.add("wrong");
    fb.innerHTML = `<div class="feedback bad pop"><span class="big">Good try! The answer is ${q.answer}</span>${q.why}</div>`;
    speak("Good try! The answer is " + q.answer);
    card.classList.add("shake"); setTimeout(() => card.classList.remove("shake"), 400);
    beep(false);
  }
  fb.insertAdjacentHTML("beforeend", `<button class="next" id="next">${i + 1 < ROUND ? "Next ➜" : "See my stars!"}</button>`);
  const nb = document.getElementById("next");
  nb.onclick = () => { i++; i < ROUND ? show() : finish(); };
  nb.focus({ preventScroll: true });
  // bring the explanation and Next button into view automatically
  setTimeout(() => {
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    fb.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "end" });
  }, 150);
}

function finish() {
  card.classList.remove("quiz", "mp");
  document.getElementById("bar").style.width = "100%";
  const n = score >= 9 ? 3 : score >= 6 ? 2 : 1;
  const champ = "You are a " + ({ times: "Multiplication", minus: "Subtraction", divide: "Division" }[mode] || "Shape") + " Champion!";
  const msg = score >= 9 ? champ : score >= 6 ? "Great job, Jayden!" : "Good try! Let's play again!";
  card.innerHTML = `
    ${navBar("All done!")}
    <div class="end-stars pop">${"⭐".repeat(n)}</div>
    <h2 class="question">${msg}</h2>
    <p style="font-size:1.4rem;font-weight:900;margin:0">You got ${score} out of ${ROUND} right!</p>
    <button class="next" id="again">🔄 Start over</button>
    <button class="ans times" id="other">🏠 Exit and pick something else</button>
    ${helpBlock()}`;
  wireHelp("Tap Start over to play the same game again with new questions. Tap Exit to go back and pick something new to practice!");
  document.getElementById("again").onclick = () => { stopConfetti(); start(); };
  document.getElementById("other").onclick = () => { stopConfetti(); menu(); };
  wireNav(menu, () => start());
  confetti(score >= 6 ? 160 : 60);
}

// little sounds
let ac, soundOn = true;
try { soundOn = localStorage.getItem("qq-sound") !== "off"; } catch (e) {}
function sndBtn() { const b = document.getElementById("sound"); b.textContent = soundOn ? "🔊" : "🔇"; }
sndBtn();
document.getElementById("sound").onclick = () => {
  soundOn = !soundOn; sndBtn();
  try { localStorage.setItem("qq-sound", soundOn ? "on" : "off"); } catch (e) {}
  if (!soundOn && window.speechSynthesis) speechSynthesis.cancel();
};
function tones(list) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    list.forEach(([f, t, len, type]) => {
      const o = ac.createOscillator(), g = ac.createGain(), at = ac.currentTime + t;
      o.type = type || "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.18, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, at + len);
      o.connect(g).connect(ac.destination); o.start(at); o.stop(at + len + 0.05);
    });
  } catch (e) {}
}
// happy welcome tune: C E G C, then a sparkle
function jingle() {
  tones([[523, 0, .25], [659, .15, .25], [784, .3, .25], [1047, .45, .5], [1319, .8, .18, "sine"], [1568, .9, .18, "sine"], [2093, 1.0, .4, "sine"]]);
}
function chime() { tones([[784, 0, .2], [1047, .12, .35]]); }
function speak(text) {
  if (!soundOn || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 1.25; u.lang = "en-US";
    speechSynthesis.speak(u);
  } catch (e) {}
}
function beep(good) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const notes = good ? [523, 659, 784] : [300, 220];
    notes.forEach((f, k) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.15, ac.currentTime + k * .1);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + k * .1 + .25);
      o.connect(g).connect(ac.destination);
      o.start(ac.currentTime + k * .1); o.stop(ac.currentTime + k * .1 + .3);
    });
  } catch (e) {}
}

// confetti
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
let bits = [], running = false;
function confetti(n) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  for (let k = 0; k < n; k++) bits.push({ x: Math.random() * cv.width, y: -20 - Math.random() * 200,
    vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 8,
    r: Math.random() * 6, c: pick(COLORS.concat(["#ffc93c"])), four: Math.random() < .5 });
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function stopConfetti() { bits = []; }
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  bits.forEach(b => {
    b.x += b.vx; b.y += b.vy; b.r += .1;
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c;
    b.four ? cx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s) : cx.fillRect(-b.s, -b.s / 3, b.s * 2, b.s / 1.5);
    cx.restore();
  });

// Easy: small facts. Normal: regular 3rd grade facts. Hard: the tough facts.
const LEVEL_FACTS = {
  easy: { tables: [2, 5, 10], lo: 1, hi: 5 },
  normal: { tables: [2, 3, 4, 5, 10], lo: 1, hi: 10 },
  hard: { tables: [6, 7, 8, 9], lo: 2, hi: 10 },

function minusAt(level) {
  let a, b;
  const borrow = (x, y) => x % 10 < y % 10 || Math.floor(x / 10) % 10 < Math.floor(y / 10) % 10;
  if (level === "easy") {
    const ta = rnd(1, 4), oa = rnd(2, 9);
    a = ta * 10 + oa;
    if (ta >= 2 && Math.random() < 0.4) b = rnd(1, ta - 1) * 10 + rnd(0, oa - 1); // like 35 − 12
    else b = rnd(1, oa);                                                         // like 37 − 5
  } else if (level === "hard") {
    do { a = rnd(200, 999); b = rnd(100, a - 11); } while (!borrow(a, b));
  } else {
    do { a = rnd(30, 99); b = rnd(11, a - 1); } while (!(a % 10 < b % 10));
  }
  return makeMinus(a, b);
}
function levelMaker(mission, level) {
  const f = LEVEL_FACTS[level] || LEVEL_FACTS.normal;
  if (mission === "times") return () => makeTimes(pick(f.tables), f.lo, f.hi);
  if (mission === "divide") return () => makeDivide(pick(f.tables), f.lo, f.hi);
  if (mission === "minus") return () => minusAt(level);
  return () => pick([makeName, makeName, makeName, makeSides, makeSides, makeIsQuad])();
}

  return out;
}

  const n = (x, lo, hi) => Math.min(hi, Math.max(lo, Math.round(+x) || lo));
  if (q.kind === "times") return dotsSVG(n(q.a, 1, 12), n(q.b, 1, 12));
  if (q.kind === "divide") return dotsSVG(n(q.d, 1, 12), n(q.q, 1, 12));

    const k = `${g.round}_${g.qi}`;
    if (MP.lastScored === k) return;
    const inP = Object.entries(players).filter(([, p]) => p.in);
    const ans = (s.answers && s.answers[k]) || {};
    const all = inP.length > 0 && inP.every(([pid]) => ans[pid]);
    if (all || now >= g.qStart + g.qTime * 1000 + 300) {
      MP.lastScored = k;
      const q = MP.qs[g.qi], upd = {};
      inP.forEach(([pid, p]) => {
        const a = ans[pid], ok = !!a && String(a.a) === String(q.answer);
        const pts = ok ? Math.round(1000 - 500 * Math.min(1, Math.max(0, a.t) / (g.qTime * 1000))) : 0;
        upd[`players/${pid}/score`] = (p.score || 0) + pts;
        upd[`players/${pid}/last`] = { pts, ok, a: a ? String(a.a) : "" };
      });
      upd["game/status"] = "reveal";
      Net.update(rp(), upd);
    }
  }
}

// Jayden taps Next to move everyone on
function hostNext() {
  const s = MP.state, g = s.game, players = s.players || {}, now = Net.now();
  if (!g || g.status !== "reveal") return;
  const k = `${g.round}_${g.qi}`;
  if (MP.lastAdv === k) return;
  MP.lastAdv = k;
  {
    if (g.qi + 1 < g.count) Net.update(rp("game"), { status: "question", qi: g.qi + 1, qStart: now + READY_MS / SPEED });
    else {
      const upd = { "game/status": "final" };
      for (const pid in players) if (pid !== "jayden") upd[`players/${pid}/again`] = players[pid].in ? "pending" : "yes";
      Net.update(rp(), upd);
    }
  }
}

// questions for a multiplayer game: no repeats while new ones are left, never the same one twice in a row
function buildMpList(mission, level, count) {
  const maker = levelMaker(mission, level), list = [], same = (x, q) => x.text === q.text && x.key === q.key;
  let tries = 0;
  while (list.length < count) {
    const q = stripQ(maker()); tries++;
    const prev = list[list.length - 1];
    if (prev && same(prev, q)) continue;
    if (tries < 300 && list.some(x => same(x, q))) continue;
    list.push(q);
  }
  return list;
}

async function hostStart() {
  const s = MP.state, g = s.game, players = s.players || {};
  const btn = document.getElementById("startbtn"); if (btn) btn.disabled = true;
  const list = buildMpList(g.mission, g.level, g.count);
  const upd = { answers: null };
  for (const pid in players) {
    if (players[pid].again === "pending") { upd["players/" + pid] = null; continue; }
    Object.assign(upd, { [`players/${pid}/in`]: true, [`players/${pid}/score`]: 0, [`players/${pid}/last`]: null, [`players/${pid}/again`]: null });
  }
  Object.assign(upd, { "game/status": "question", "game/questions": JSON.stringify(list), "game/qi": 0, "game/qStart": Net.now() + READY_MS / SPEED, "game/round": (g.round || 0) + 1 });
  MP.finalSnap = null;
  await Net.update(rp(), upd);
}
async function hostToLobby(everyone) {
  const s = MP.state, players = s.players || {}, upd = { "game/status": "lobby", "players/jayden/again": null };
  if (everyone) for (const pid in players) Object.assign(upd, { [`players/${pid}/again`]: null, [`players/${pid}/in`]: true });
  MP.finalSnap = null;
  await Net.update(rp(), upd);
}
async function hostClose() {
  await Net.update(rp(), { "game/status": "closed", "game/closedAt": Net.now(), "host/online": false });
  leaveRoom("You closed your room.");
  setTimeout(async () => { const g = await Net.get(rp("game")); if (g && g.status === "closed") Net.remove(rp()); }, 2500);
}

// ---------- shared screen pieces ----------
function mpBar(label, restart) {
  return `<div class="quiz-bar">
      <button class="mini" id="quit">🏠 Exit</button>
      <div class="qnum">${label}</div>
      ${restart && MP.isHost ? '<button class="mini" id="restart">🔄 Start over</button>' : '<span class="mini-spacer"></span>'}
    </div>`;
}
function wireMpBar() {
  const q = document.getElementById("quit");
  if (q) q.onclick = () => { stopConfetti(); MP.isHost ? hostClose() : leaveRoom(); };
  const r = document.getElementById("restart");
  if (r) r.onclick = () => { stopConfetti(); hostToLobby(true); };
}
function ranked() {
  const ps = Object.entries((MP.state && MP.state.players) || {}).map(([pid, p]) => Object.assign({ pid }, p));
  return ps.sort((a, b) => (b.score || 0) - (a.score || 0) || (a.joined || 0) - (b.joined || 0));
}
const MEDALS = ["🥇", "🥈", "🥉"];
function boardChips() {
  return ranked().filter(p => p.in).map((p, n) =>
    `<span class="chip${p.pid === MP.pid ? " me" : ""}">${p.score ? (MEDALS[n] || "") : ""}${p.admin ? "👑" : ""} ${esc(p.name)} <b>${fmt(p.score)}</b></span>`).join("");
}
function missionLine(g) {
  if (!g || !g.mission) return `<div class="mission-sum waiting">Waiting for Jayden to pick a mission…</div>`;
  return `<div class="mission-sum"><span class="mi">${MISSION_ICONS[g.mission]}</span><b>${MISSION_NAMES[g.mission]}</b>${g.level ? `<span class="tag lv-${g.level}">${LEVEL_NAMES[g.level]}</span>` : ""}<span class="tag">${g.count} questions</span></div>`;
}
function setHeader() {
  const me = (MP.state.players || {})[MP.pid] || {}, g = MP.state.game || {};
  document.getElementById("score").textContent = fmt(me.score);
  document.getElementById("bar").style.width = g.count ? ((g.status === "final" ? g.count : (g.qi || 0)) / g.count * 100) + "%" : "0%";
}

// ---------- screens ----------
function rLobby() {
  card.classList.remove("quiz");

  card.innerHTML = `
    ${mpBar("Jayden's room")}
    <div class="lobby-head">
      <div class="lobby-fox">${BUDDY}</div>
      <div class="bubble"><div class="bubble-hi">${MP.isHost ? "Your room is open!" : "Welcome, " + esc(MP.name) + "!"}</div>
        ${MP.isHost ? "Players show up below as they join. Tap Start when everyone is in." : "You're in Jayden's room. The game starts when Jayden taps Start."}</div>
    </div>
    <div id="msum">${missionLine(g)}</div>
    ${MP.isHost ? "" : `<div class="mnote" id="mnote" hidden></div>`}

function rulesHTML(g) {
  const lv = g.mission === "shapes" ? "" : `<div class="rule-row"><span>Difficulty</span>${["easy", "normal", "hard"].map(l => `<button class="rchip${g.level === l ? " on" : ""}" data-rl="${l}">${LEVEL_NAMES[l]}</button>`).join("")}</div>`;
  return lv + `<div class="rule-row"><span>Questions</span>${[5, 10, 15, 20].map(n => `<button class="rchip${g.count === n ? " on" : ""}" data-rn="${n}">${n}</button>`).join("")}</div>`;
}
function rReady() {
  card.classList.remove("quiz");
  const g = MP.state.game;
  card.innerHTML = `
    ${mpBar(`Question ${g.qi + 1} of ${g.count}`, true)}
    <div class="board" id="board"></div>
    <div class="ready pop"><p>Get ready!</p><div class="ready-n" id="readyn"></div><p class="ready-sub">${MISSION_ICONS[g.mission]} ${MISSION_NAMES[g.mission]}${g.level ? " · " + LEVEL_NAMES[g.level] : ""}</p></div>`;
  wireMpBar();
  readyTick(g);
}
function rQuestion() {
  card.classList.add("quiz");
  const g = MP.state.game, q = MP.qs[g.qi];
  MP.timesUp = false; MP.tickN = -1;
  card.innerHTML = `
    <div class="mp-head">
      ${mpBar(`Question ${g.qi + 1} of ${g.count} · <span class="tnum">⏱ <b id="tleft">${Math.ceil(g.qTime)}</b></span>`, true)}
      <div class="tbar"><div id="tfill"></div></div>
      <div class="board" id="board"></div>
    </div>
    <h2 class="question">${esc(q.text)}</h2>
    <div class="shape-box pop">${visualFor(q)}</div>
    <div class="answers ${q.two ? "two" : ""}">
      ${q.options.map(o => `<button class="ans mp-ans" data-a="${esc(o)}">${esc(o)}</button>`).join("")}
    </div>
    ${helpBlock()}
    <div id="fb"></div>`;
  card.querySelectorAll(".mp-ans").forEach(b => b.onclick = () => mpAnswer(b));
  wirePad();
  wireMpBar();
}
async function mpAnswer(btn) {
  const g = MP.state.game;
  if (MP.answered[g.qi] || g.status !== "question") return;
  const t = Net.now() - g.qStart;
  if (t > g.qTime * 1000) return;
  MP.answered[g.qi] = btn.dataset.a;
  card.querySelectorAll(".mp-ans").forEach(b => b.disabled = true);
  btn.classList.add("picked");
  const fb = document.getElementById("fb");
  fb.innerHTML = `<div class="feedback try pop"><span class="big">🔒 Locked in!</span><span id="acount">Waiting for the others…</span></div>`;
  tones([[660, 0, .12], [880, .08, .15]]);
  await Net.set(rp(`answers/${g.round}_${g.qi}/${MP.pid}`), { a: btn.dataset.a, t: Math.max(0, Math.round(t)) });
}
function rReveal() {
  card.classList.remove("quiz");
  const g = MP.state.game, q = MP.qs[g.qi], me = MP.state.players[MP.pid] || {}, last = me.last || { pts: 0, ok: false, a: "" };
  let head;
  if (last.ok) head = `<span class="big">🎉 Correct! +${fmt(last.pts)} points</span>`;
  else if (last.a) head = `<span class="big">Good try! The answer is ${esc(q.answer)}</span>`;
  else head = `<span class="big">⏰ Time ran out. The answer is ${esc(q.answer)}</span>`;
  head += `<span class="total-line">Your total: ${fmt(me.score)} points</span>`;
  const lastQ = g.qi + 1 >= g.count;
  card.innerHTML = `
    ${mpBar(`Question ${g.qi + 1} of ${g.count}`, true)}
    <h2 class="question small-q">${esc(q.text)}</h2>
    <div class="answers reveal-ans ${q.two || q.options.length === 2 ? "two" : ""}">
      ${q.options.map(o => `<div class="ans ${o === q.answer ? "right" : (o === last.a ? "wrong" : "dim")}">${esc(o)}</div>`).join("")}
    </div>
    <div class="feedback ${last.ok ? "good" : "bad"} pop">${head}${esc(q.why)}</div>
    <h3 class="sub">Total points</h3>
    <div class="scores withd" id="scores"></div>
    ${MP.isHost
      ? `<button class="next" id="nextq">${lastQ ? "See final scores 🏆" : "Next question ➜"}</button>`
      : `<p class="wait-dots">Waiting for Jayden to tap Next<span>.</span><span>.</span><span>.</span></p>`}`;
  wireMpBar();
  if (MP.isHost) document.getElementById("nextq").onclick = e => { e.currentTarget.disabled = true; stopConfetti(); hostNext(); };
  if (last.ok) { beep(true); confetti(30); speak(pick(CHEERS) + " Plus " + last.pts + " points!"); }
  else { beep(false); speak("The answer is " + q.answer); }
  setTimeout(() => { const sc = document.getElementById("scores"); if (sc && sc.getBoundingClientRect().top > innerHeight * 0.6) sc.scrollIntoView({ behavior: "smooth", block: "center" }); }, 900);
}
function scoresHTML(list, showDelta) {
  const head = showDelta ? `<div class="srow shead"><span></span><span>Player</span><span>This question</span><span>Total</span></div>` : "";
  return head + list.map((p, n) => `<div class="srow${p.pid === MP.pid ? " me" : ""}">
      <span class="rank">${MEDALS[n] || n + 1}</span>
      <span class="sname">${p.admin ? "👑 " : ""}${esc(p.name)}${p.pid === MP.pid ? " (you)" : ""}</span>
      ${showDelta ? `<span class="delta ${p.last && p.last.ok ? "up" : ""}">${p.last && p.last.ok ? "+" + fmt(p.last.pts) : "+0"}</span>` : ""}
      <span class="spts">${fmt(p.score)}</span></div>`).join("");
}
function rFinal() {
  card.classList.remove("quiz");
  if (!MP.finalSnap) MP.finalSnap = ranked().filter(p => p.in);
  const list = MP.finalSnap, top = list[0], g = MP.state.game || {};
  const tie = list.length > 1 && list[1].score === top.score;
  const winLine = tie ? "It's a tie at the top!" : (top.pid === MP.pid ? "You win! 🏆" : `${esc(top.name)} wins! 🏆`);
  const meRank = list.findIndex(p => p.pid === MP.pid);
  card.innerHTML = `
    ${mpBar("Final scores")}
    <div class="end-stars pop">🏆</div>
    <h2 class="question">${winLine}</h2>
    <p class="final-sub">${meRank >= 0 ? `You finished ${["1st", "2nd", "3rd"][meRank] || (meRank + 1) + "th"} with ${fmt(list[meRank].score)} points!` : ""}</p>
    <div class="scores">${scoresHTML(list, false)}</div>
    <div id="againbox"></div>`;
  wireMpBar();
  confetti(meRank === 0 ? 160 : 70);
  speak(tie ? "It's a tie! Great game everyone!" : (top.pid === MP.pid ? "You win! Amazing job!" : top.name + " wins! Great game everyone!"));
}
function againHTML() {
  const me = MP.state.players[MP.pid] || {}, g = MP.state.game || {};
  const ins = ranked().filter(p => p.admin || p.again === "yes").map(p => esc(p.name)).join(", ");
  if (MP.isHost) {
    return `<h3 class="sub">Play again?</h3>
      <div class="answers two"><button class="next" id="again-yes">🔄 Play again</button><button class="ans times" id="again-no">🏠 No, close my room</button></div>
      <p class="join-note">Ready to play again: ${ins}</p>`;
  }
  if (me.again === "yes") return `<p class="wait-dots">You're in! Waiting for Jayden<span>.</span><span>.</span><span>.</span></p><p class="join-note">Ready to play again: ${ins}</p>`;
  return `<h3 class="sub">Play again?</h3>
    <div class="answers two"><button class="next" id="again-yes">🔄 Yes, play again</button><button class="ans times" id="again-no">🚪 No thanks</button></div>`;
}
function rWatch() {
  card.classList.remove("quiz");
  const g = MP.state.game || {};
  card.innerHTML = `
    ${mpBar("Jayden's room")}
    <div class="lobby-head">
      <div class="lobby-fox">${BUDDY}</div>
      <div class="bubble"><div class="bubble-hi">Game in progress!</div>You'll jump in when the next game starts. Here's how everyone is doing.</div>
    </div>
    <div id="msum">${missionLine(g)}</div>
    <p class="final-sub" id="watchq"></p>
    <div class="scores" id="scores"></div>`;
  wireMpBar();
}

// update the live parts without redrawing the screen
function refresh() {
  const s = MP.state, g = s.game || {}, players = s.players || {};
  setHeader();
  const plist = document.getElementById("plist");
  if (plist) {
    const list = Object.entries(players).map(([pid, p]) => Object.assign({ pid }, p)).sort((a, b) => (b.admin ? 1 : 0) - (a.admin ? 1 : 0) || (a.joined || 0) - (b.joined || 0));
    plist.innerHTML = list.map(p => `<div class="pchip${p.pid === MP.pid ? " me" : ""}${p.again === "pending" ? " deciding" : ""}">
        <span class="pav">${p.admin ? "👑" : esc(p.name[0])}</span>${esc(p.name)}${p.pid === MP.pid ? " (you)" : ""}${p.admin ? '<small>Host</small>' : (p.again === "pending" ? "<small>Deciding…</small>" : "")}</div>`).join("");
    const ready = list.filter(p => p.again !== "pending");
    document.getElementById("pcount").textContent = `(${ready.length})`;
    const sb = document.getElementById("startbtn");
    if (sb) {
      const enough = ready.length >= 2;
      sb.disabled = !enough;
      document.getElementById("starthint").textContent = enough
        ? (list.some(p => p.again === "pending") ? "Players still deciding will be left out if you start now." : "")
        : "Waiting for at least 1 more player to join.";
    }
  }
  const msum = document.getElementById("msum");
  if (msum) msum.innerHTML = missionLine(g);
  // tell guests which mission Jayden picked, especially when it's not the one they chose
  const mnote = document.getElementById("mnote");
  if (mnote) {
    if (g.mission && MP.picked) {
      const mine = MISSION_NAMES[MP.picked], his = MISSION_NAMES[g.mission];
      const differs = g.mission !== MP.picked;
      mnote.hidden = false;
      mnote.className = "mnote pop" + (differs ? " differs" : "");
      mnote.innerHTML = differs
        ? `<b>Heads up!</b> You picked ${MISSION_ICONS[MP.picked]} ${mine}, but Jayden chose ${MISSION_ICONS[g.mission]} <b>${his}</b>. Everyone in the room plays ${his}.`
        : `You'll be playing ${MISSION_ICONS[g.mission]} <b>${his}</b>, the same mission you picked!`;
      if (MP.toldMission !== g.mission) {
        MP.toldMission = g.mission;
        const say = differs ? `Heads up! Jayden chose ${his}, so everyone will play ${his}.` : `Great news! Jayden chose ${his} too.`;
        setTimeout(() => { if (document.getElementById("mnote")) talk(say, card.querySelector(".robot")); }, 1600);
      }
    } else mnote.hidden = true;
  }
  const rules = document.getElementById("rules");
  if (rules && g.mission) {
    rules.innerHTML = rulesHTML(g);
    rules.querySelectorAll("[data-rl]").forEach(b => b.onclick = () => Net.update(rp("game"), { level: b.dataset.rl }));
    rules.querySelectorAll("[data-rn]").forEach(b => b.onclick = () => Net.update(rp("game"), { count: +b.dataset.rn }));
  }
  const board = document.getElementById("board");
  if (board) board.innerHTML = boardChips();
  const scores = document.getElementById("scores");
  if (scores && g.status === "reveal") scores.innerHTML = scoresHTML(ranked().filter(p => p.in), true);
  else if (scores && document.getElementById("watchq")) {
    scores.innerHTML = scoresHTML(ranked().filter(p => p.in), false);
    document.getElementById("watchq").textContent = g.status === "final" ? "Final scores are in!" : `Question ${(g.qi || 0) + 1} of ${g.count}`;
  }
  const ac = document.getElementById("acount");
  if (ac && g.status === "question") {
    const inP = Object.keys(players).filter(pid => players[pid].in);
    const got = Object.keys((s.answers || {})[`${g.round}_${g.qi}`] || {}).filter(pid => players[pid] && players[pid].in).length;
    ac.textContent = `Waiting for the others… (${got} of ${inP.length} answered)`;
  }
  const ab = document.getElementById("againbox");
  if (ab) {
    ab.innerHTML = againHTML();
    const y = document.getElementById("again-yes"), n = document.getElementById("again-no");
    if (y) y.onclick = () => { stopConfetti(); MP.isHost ? hostToLobby(false) : Net.update(rp("players/" + MP.pid), { again: "yes" }); };
    if (n) n.onclick = () => { stopConfetti(); MP.isHost ? hostClose() : leaveRoom("Thanks for playing! Pick any mission you like."); };
  }
}

// ---------- admin PIN ----------
function pinScreen(m) {
  card.classList.remove("quiz", "mp");
  let pin = "";
  card.innerHTML = `
    ${navBar(MISSION_ICONS[m] + " " + MISSION_NAMES[m] + " · Multiplayer")}
    <h2 class="question pop">Hi Jayden! Enter your 4 digit PIN</h2>
    <div class="pin-dots" id="pdots"></div>
    <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "⌫"].map(k => k === "" ? "<span></span>" : `<button class="ans pin-key" data-k="${k}">${k}</button>`).join("")}</div>
    <p class="join-note" id="pinerr"></p>
    <button class="back" id="pinback">Back</button>`;
  wireNav(menu, () => pinScreen(m));
  const dots = () => { const d = document.getElementById("pdots"); if (!d) return; d.innerHTML = [0, 1, 2, 3].map(n => `<span class="${n < pin.length ? "on" : ""}"></span>`).join(""); };
  dots();
  card.querySelectorAll(".pin-key").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    pin = k === "⌫" ? pin.slice(0, -1) : (pin + k).slice(0, 4);
    dots();
    if (pin.length === 4) {
      if (pin === CONFIG.ADMIN_PIN) { chime(); hostEntry(m); }
      else { document.getElementById("pinerr").textContent = "That's not the right PIN. Try again."; card.classList.add("shake"); setTimeout(() => card.classList.remove("shake"), 400); pin = ""; setTimeout(dots, 250); }
    }
  });
  document.getElementById("pinback").onclick = () => whoScreen(m);
}
